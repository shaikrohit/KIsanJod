  <!-- Head / Face -->
  <ellipse cx="64" cy="62" rx="22" ry="24" fill="url(#skinGrad)" />
  
  <!-- Ears -->
  <circle cx="42" cy="62" r="5" fill="#fba063" />
  <circle cx="86" cy="62" r="5" fill="#fba063" />
  
  <!-- Eyes -->
  <ellipse cx="55" cy="60" rx="2.5" ry="3" fill="#1e293b" />
  <ellipse cx="73" cy="60" rx="2.5" ry="3" fill="#1e293b" />
  <circle cx="56" cy="59" r="0.8" fill="#ffffff" />
  <circle cx="74" cy="59" r="0.8" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M50 54 Q55 52 60 54" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M68 54 Q73 52 78 54" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none" />
  
  <!-- Nose -->
  <path d="M64 59 L62 67 L66 67" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Mustache -->
  <path d="M52 73 Q64 77 64 72 Q64 77 76 73 Q71 79 64 77 Q57 79 52 73 Z" fill="#451a03" />
  
  <!-- Smile -->
  <path d="M58 79 Q64 83 70 79" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Turban (Pagri) with folds -->
  <path d="M40 48 C36 28, 52 16, 64 16 C76 16, 92 28, 88 48 C88 50, 78 48, 64 48 C50 48, 40 50, 40 48 Z" fill="url(#turbanGrad)" />
  <path d="M38 46 Q64 36 90 46 Q64 52 38 46 Z" fill="#f59e0b" />
